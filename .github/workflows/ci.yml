name: Code Quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
      - develop-v5
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    name: ci
    uses: studioespresso/.github/.github/workflows/ci.yml@main
    with:
      craft_version: '5'
      php_version: "8.4"
      jobs: '["ecs", "phpstan"]'
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: date_range_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_mysql

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/codecept run unit
        env:
          DB_SERVER: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: root
          DB_DATABASE: date_range_testing
          DB_DRIVER: mysql
          DB_PORT: 3306
