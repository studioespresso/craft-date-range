actor: Tester
paths:
    tests: tests
    output: tests/_output
    data: tests/_data
    support: tests/_support
    envs: tests/_envs
bootstrap: _bootstrap.php
modules:
    config:
        \craft\test\Craft:
            configFile: 'tests/_craft/config/test.php'
            entryUrl: 'https://your-site-url.test/index.php'
            projectConfig: {}
            migrations: []
            plugins:
                date-range:
                    class: '\studioespresso\daterange\DateRange'
                    handle: date-range
            cleanup: true
            transaction: true
            dbSetup: {clean: true, setupCraft: true}
